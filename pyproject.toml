[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "turnos"
version = "2.17.0"
description = "Asignación automática de turnos de mañana y tarde para un equipo de médicos"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "ortools>=9.15",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyflakes>=3"]
# Modo servidor en la red local (docs/diseno-servidor.md): certificados, mDNS y QR.
servidor = ["cryptography>=41", "zeroconf>=0.130", "segno>=1.6"]
# Aplicaciones de escritorio como clientes de un servidor: buscarlo en la red (mDNS).
cliente = ["zeroconf>=0.130"]

[project.scripts]
turnos = "turnos.arranque.web:main"
turnos-escritorio = "turnos.arranque.escritorio:main"
turnos-gnome = "turnos.arranque.gnome:main"
turnos-windows = "turnos.arranque.windows:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["escritorio: prueba de humo de la ventana GTK (necesita GTK, WebKitGTK y xvfb-run)"]

[tool.setuptools.package-data]
turnos = ["recursos/festivos/*.json", "recursos/municipios.json", "datos/migraciones/script.py.mako", "arranque/gnome/estilos.css", "arranque/gnome/iconos/*.svg", "web/**/*"]
