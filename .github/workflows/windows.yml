# Versión de Windows (docs/windows.md): construye TurnosMedicos.exe con PyInstaller en un
# Windows de verdad, lo prueba (TurnosMedicos.exe --prueba) y guarda el zip. Con una
# etiqueta vX.Y.Z, además lo adjunta a la versión publicada (release) de GitHub.
name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: interfaz/package-lock.json

      - name: Interfaz web (dentro del paquete)
        shell: pwsh
        run: |
          cd interfaz
          npm ci
          npm run build
          cd ..
          Copy-Item -Recurse interfaz/dist src/turnos/web

      - name: Dependencias y PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[cliente]" "pyinstaller==6.22.3"

      - name: TurnosMedicos.exe
        shell: pwsh
        working-directory: empaquetado/windows
        run: python -m PyInstaller --noconfirm --log-level WARN turnos-medicos.spec

      - name: Autoprueba (servidor interno, interfaz y motor)
        shell: pwsh
        working-directory: empaquetado/windows
        run: |
          $p = Start-Process -FilePath dist\TurnosMedicos\TurnosMedicos.exe `
                 -ArgumentList "--prueba", "$PWD\autoprueba.txt" -Wait -PassThru
          Get-Content autoprueba.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Zip
        id: zip
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $zip = "turnos-medicos-$version-windows.zip"
          Compress-Archive -Path empaquetado/windows/dist/TurnosMedicos -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: turnos-medicos-windows
          path: ${{ steps.zip.outputs.zip }}

      - name: Adjuntar a la versión publicada
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "Turnos médicos $tag" --notes "Versión $tag." }
          gh release upload $tag "${{ steps.zip.outputs.zip }}" --clobber
